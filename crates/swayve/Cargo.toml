[package]
name = "swayve"
version = "0.1.0"
edition = "2024"

[dependencies]
swayve-types = { path = "../swayve-types" }
swayve-hud = { path = "../swayve-hud" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
swayipc-async = "2.0.1"
clap = { version = "4.4", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
futures-lite = "2.0"
shlex = "1.3"
