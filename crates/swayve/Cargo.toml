[package]
name = "swayve"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
swayve-types = { path = "../swayve-types" }
swayve-hud = { path = "../swayve-hud" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
swayipc-async = "3.0.0"
clap = { version = "4.4", features = ["derive"] }
toml = "1.2"
anyhow = "1.0"
futures-lite = "2.0"
shlex = "2.0"
